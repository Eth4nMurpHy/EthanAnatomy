[package]
name = "anatolume"
version = "0.1.7"
description = "Offline bilingual anatomy explorer"
authors = ["isunky"]
edition = "2021"
license = "MIT"

[lib]
name = "anatolume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
