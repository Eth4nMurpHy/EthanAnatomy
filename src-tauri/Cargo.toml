[package]
name = "anatomy-workspace"
version = "0.1.0"
description = "Unnamed cross-platform anatomy learning workspace"
authors = ["Eth4nMurpHy"]
edition = "2021"
license = "MIT"

[lib]
name = "anatomy_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
