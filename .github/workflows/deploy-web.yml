name: Deploy workspace website
on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'web/**'
      - 'public/**'
      - 'tools/prepare-legal.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tests/site-smoke.mjs'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: workspace-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build:pages
      - name: Configure the enabled GitHub Pages site
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish website
        id: publish
        uses: actions/deploy-pages@v5
      - name: Verify the public website
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
          SCREENSHOT_DIR: site-check
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --location "$SITE_URL" --output /tmp/deployed-index.html; then break; fi
            sleep 5
          done
          grep -q '人体学习工作台' /tmp/deployed-index.html
          CHROMIUM_PATH="$(command -v google-chrome)" node tests/site-smoke.mjs
          printf 'Verified online workspace: %s\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=Website verified::%s — both models and production browser checks passed.\n' "$SITE_URL"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-check
          path: site-check/
          if-no-files-found: ignore
