name: Build and publish new workspace
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/workspace-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: new-workspace-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run ci:check
      - run: CHROMIUM_PATH="$(command -v google-chrome)" npm run test:browser
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
            command: client:build:linux
          - os: windows-latest
            platform: Windows
            command: client:build:windows
          - os: macos-latest
            platform: macOS
            command: client:build:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb xauth dbus-x11 webkit2gtk-driver libgl1-mesa-dri
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build native development packages
        run: npm run ${{ matrix.command }} -- -- --locked
      - if: runner.os == 'Linux'
        name: Exercise the packaged native workspace
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        shell: bash
        run: |
          cargo install tauri-driver --locked
          unpacked="$(mktemp -d)"
          package="$(find src-tauri/target -path '*/bundle/deb/Anatomy Workspace Dev_0.1.0_*.deb' -type f -print -quit)"
          dpkg-deb --extract "$package" "$unpacked"
          TAURI_APP_PATH="$unpacked/usr/bin/anatomy-workspace" xvfb-run -a dbus-run-session -- sh tools/native-smoke.sh
      - if: runner.os == 'macOS'
        name: Verify universal macOS bundle
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Anatomy Workspace Dev.app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs="$(lipo -archs "$app/Contents/MacOS/$executable")"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          codesign --verify --deep --strict "$app"
      - name: Collect platform packages and notices
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
        run: |
          mkdir -p packages
          find src-tauri/target -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' \) -path '*/bundle/*' -name 'Anatomy Workspace Dev_0.1.0_*' -exec cp {} packages/ \;
          cp LICENSE NOTICE.md public/ATTRIBUTION.md packages/
          test -n "$(find packages -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.exe' \) -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-${{ matrix.platform }}
          path: packages/*
          compression-level: 0
          if-no-files-found: error
  web:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          cp LICENSE NOTICE.md public/ATTRIBUTION.md dist/
          (cd dist && zip -qr ../Workspace-Web.zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-Web
          path: Workspace-Web.zip
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [checks, desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: workspace-*
          path: packages
          merge-multiple: true
      - name: Verify package set and publish development preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$(find packages -name '*.deb' -print -quit)"
          test -n "$(find packages -name '*.AppImage' -print -quit)"
          test -n "$(find packages -name '*.dmg' -print -quit)"
          test -n "$(find packages -name '*.exe' -print -quit)"
          test -f packages/Workspace-Web.zip
          (cd packages && sha256sum -- *.deb *.AppImage *.dmg *.exe *.zip > SHA256SUMS)
          tag="workspace-v0.1.0-preview.${GITHUB_RUN_NUMBER}"
          cat > /tmp/workspace-notes.md <<'NOTES'
          ## 新应用开发预览 · 正式名称待定
          这是新的三维人体学习工作区，不是旧版层知界面的更名包。界面、应用状态、搜索、模型加载和 Three.js 场景控制位于 studio/，使用新的实现；模型数据与部分工程基础的实际来源仍明确保留署名。

          功能：模型切换、系统显隐、英文/常用中文关键词检索、结构选择/聚焦/单独观察、本地收藏、透明度与相机控制。显隐操作保持相机视角。使用独立开发标识，无自动更新通道。

          ### 安装
          - Linux x86_64：下载 .deb（Debian/Ubuntu，依赖 WebKitGTK 4.1）或 .AppImage（兼容系统，需 FUSE 2 或解压运行）。
          - Windows x64：下载 -setup.exe 安装包；需要 WebView2。未使用 Authenticode 系统代码签名。
          - macOS：下载 .dmg；通用版支持 Intel / Apple Silicon，未经 Apple 公证，首次启动可能需要在系统安全设置中允许。
          - Web：下载 Workspace-Web.zip，解压后通过 HTTP/HTTPS 提供。不能直接双击 index.html。

          已运行共享代码/数据测试、浏览器交互回归，并在 Linux 下运行打包后的原生客户端烟雾测试。Windows/macOS 已构建，但实机 GPU、输入和系统兼容性仍需分别验收。

          正式名称、完整医学术语与专业内容审校尚未完成。应用用于教育与探索，不用于临床决策。代码 MIT；模型数据 CC BY 4.0；详细依赖、参考、历史继承及数据来源见随包提供的 LICENSE、NOTICE.md、ATTRIBUTION.md。
          NOTES
          printf '\nSource: %s\nBuild: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/workspace-notes.md
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Workspace 0.1.0 — 新应用开发预览（名称待定）' --prerelease --notes-file /tmp/workspace-notes.md
          fi
          printf 'Download: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
